name: Test

on:
  push:
    branches:
      - mother

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: olivine
          POSTGRES_PASSWORD: olivine
          POSTGRES_DB: olivine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U olivine"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        fetch-tags: true
        submodules: false

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26.0'

    - name: Install dependencies
      run: go mod download

    - name: Run go vet
      run: make vet

    - name: Check formatting
      run: make fmt-check

    # Over the whole tree, not just the diff, and not allowed to fail.
    # The tree meets the rule, so there is nothing to grandfather.
    - name: Check line width
      run: make width-check

    - name: Run tests
      run: make test
      env:
        TEST_DATABASE_URL: >-
          postgres://olivine:olivine@localhost:5432/olivine_test?sslmode=disable
