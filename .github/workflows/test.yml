# The fast suite: everything that needs no container.
#
# The golden harness is not here — it builds OpenLDAP from the
# submodule and takes minutes. It lives in golden.yml.
name: Test

on:
  push:
    branches: [mother]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: olivine
          POSTGRES_PASSWORD: olivine
          POSTGRES_DB: olivine_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U olivine"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          # Not needed: the standard schema is embedded, so the
          # whole of this suite runs without openldap/. Only the
          # golden harness reads it.
          submodules: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - run: go mod download

      - name: Formatting
        run: make fmt-check

      - name: Vet
        run: make vet

      # Over the whole tree, not just the diff. The tree meets the
      # rule, so there is nothing to grandfather.
      - name: Line width and function length
        run: make width-check

      # TEST_DATABASE_URL turns the store tests on. Without it they
      # skip, which would leave the Postgres service above doing
      # nothing at all.
      - name: Tests
        run: make test
        env:
          TEST_DATABASE_URL: >-
            postgres://olivine:olivine@localhost:5432/olivine_test?sslmode=disable

      - name: Race detector
        run: make race
        env:
          TEST_DATABASE_URL: >-
            postgres://olivine:olivine@localhost:5432/olivine_test?sslmode=disable
