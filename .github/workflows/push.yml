# Publish the image to the registry.
#
# Only from mother and only for a real commit, never a pull
# request: a fork's PR must not be able to push an image.
name: Push

on:
  push:
    branches: [mother]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  push:
    runs-on: ubuntu-latest
    # Belt and braces alongside the triggers above.
    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - run: go mod download

      # A registry path must be lower case and a GitHub owner need
      # not be, so it is folded here rather than assumed. Build and
      # push must name the same image, so this comes first.
      - name: Work out the image name
        id: image
        run: |
          owner=$(echo "${{ github.repository_owner }}" \
            | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/$owner/olivine-ldap" >> "$GITHUB_OUTPUT"

      - name: Build the image
        run: make pod-build IMAGE="${{ steps.image.outputs.name }}"

      - name: Log in to the registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login \
            ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push
        run: make pod-push IMAGE="${{ steps.image.outputs.name }}"
